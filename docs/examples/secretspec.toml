[project]
name = "synthetic-consumer"
revision = "1.0"

[profiles.default]
FORGE_ENVIRONMENT = { description = "Target", default = "development" }
FORGE_SITE = { description = "Site", default = "synthetic.atlassian.net" }
FORGE_PRODUCT = { description = "Product", default = "jira" }
LOCAL_ONLY = { description = "Implicit local input", required = true }
MANIFEST_INPUT = { description = "Manifest endpoint", required = true }
RUNTIME_ONLY = { description = "Function input", required = true }
SHARED = { description = "Shared endpoint", required = true }
OPTIONAL = { description = "Absent optional value", required = false }

[scopes.manifest]
secrets = ["MANIFEST_INPUT", "SHARED"]

[scopes.runtime]
secrets = ["RUNTIME_ONLY", "SHARED", "OPTIONAL"]
